<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="100" fill="#0b1120"/>
  
  <!-- Subtle glowing background grid to represent "Computer Vision Space" -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.5">
    <line x1="0" y1="125" x2="500" y2="125" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="375" x2="500" y2="375" />
    <line x1="125" y1="0" x2="125" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="375" y1="0" x2="375" y2="500" />
  </g>

  <!-- Glowing aura behind the figure -->
  <circle cx="250" cy="250" r="120" fill="#10b981" opacity="0.15" filter="blur(15px)"/>

  <!-- Computer Vision Pose Estimation Skeleton (MediaPipe style) -->
  <g stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Spine -->
    <line x1="250" y1="160" x2="250" y2="300" stroke-width="10"/>
    
    <!-- Left Arm (flexed/curl) -->
    <polyline points="250,180 170,200 150,130" />
    
    <!-- Right Arm (straight/tracking) -->
    <polyline points="250,180 340,240 400,200" />
    
    <!-- Left Leg (bent) -->
    <polyline points="250,300 180,380 180,440" />
    
    <!-- Right Leg (straight) -->
    <polyline points="250,300 320,380 340,460" />
  </g>

  <!-- Highlighted Angle Tracking (Representing your vector math) -->
  <!-- Left Elbow Angle -->
  <path d="M 170 170 A 30 30 0 0 0 195 205" fill="none" stroke="#10b981" stroke-width="6"/>
  <!-- Right Knee Angle -->
  <path d="M 290 355 A 40 40 0 0 0 320 410" fill="none" stroke="#10b981" stroke-width="6"/>

  <!-- Skeletal Nodes (Keypoints) -->
  <g fill="#0b1120" stroke="#10b981" stroke-width="4">
    <!-- Head/Face node -->
    <circle cx="250" cy="110" r="22" stroke="#38bdf8" fill="#38bdf8" opacity="0.9"/>
    
    <!-- Shoulders -->
    <circle cx="250" cy="180" r="10"/>
    
    <!-- Left Arm Nodes -->
    <circle cx="170" cy="200" r="9"/>
    <circle cx="150" cy="130" r="9"/>
    
    <!-- Right Arm Nodes -->
    <circle cx="340" cy="240" r="9"/>
    <circle cx="400" cy="200" r="9"/>
    
    <!-- Hips -->
    <circle cx="250" cy="300" r="10"/>
    
    <!-- Left Leg Nodes -->
    <circle cx="180" cy="380" r="9"/>
    <circle cx="180" cy="440" r="9"/>
    
    <!-- Right Leg Nodes -->
    <circle cx="320" cy="380" r="9"/>
    <circle cx="340" cy="460" r="9"/>
  </g>
</svg>
